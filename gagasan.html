    <style>
        .page-header {
            background-color: rgb(238, 236, 233);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .page-header h1 {
            color: rgb(9, 9, 67);
            font-size: 32px;

        }

        .page-header p {
            color: #555;

            margin: 0 auto;
        }

        .container-gagasan {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Filter Kategori Button */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: #fff;
            border: 1px solid rgb(9, 9, 67);
            color: rgb(9, 9, 67);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-filter.active, .btn-filter:hover {
            background: rgb(9, 9, 67);
            color: #fff;
        }

        /* Grid Kartu Gagasan */
        .grid-gagasan {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card-gagasan {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        /* Animasi saat kartu disembunyikan/ditampilkan */
        .card-gagasan.hide {
            display: none !important;
        }

        .card-img-box {
            position: relative;
            height: 200px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-kategori {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f39c12;
            color: #fff;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-tanggal {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .card-title {
            color: rgb(9, 9, 67);
            font-size: 18px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .card-snippet {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .btn-baca {
            background: rgb(9, 9, 67);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-baca:hover {
            background: #f39c12;
        }

        @media screen and (max-width: 576px) {
            .grid-gagasan {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Script JavaScript Filter Interaktif -->
    <script>
        // Toggle Hamburger Menu
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        if(hamburger) {
            hamburger.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                hamburger.classList.toggle('active');
            });
        }

        // Logic Filter Kategori Interaktif
        const filterBtns = document.querySelectorAll('.btn-filter');
        const cards = document.querySelectorAll('.card-gagasan');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 1. Ubah status tombol aktif
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // 2. Filter Kartu Artikel
                const filterValue = btn.getAttribute('data-filter');

                cards.forEach(card => {
                    const category = card.getAttribute('data-category');

                    if (filterValue === 'all' || filterValue === category) {
                        card.classList.remove('hide');
                    } else {
                        card.classList.add('hide');
                    }
                });
            });
        });
    </script>
